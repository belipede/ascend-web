# Runs the app's tests on every pull request, before anything is merged and published to the phone.
# Uses Chromium on a simulated iPhone; it can't test Safari on a real iPhone.
name: Tests
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright (test tool only, not part of the app)
        run: |
          npm install --no-save --no-package-lock playwright@1.49.1
          npx playwright install --with-deps chromium
      - name: Previous live version, for the "your data still loads" checks
        run: git show origin/main:index.html > "$RUNNER_TEMP/old.html"
      - name: Data safety
        run: node tests/data-safety.js "$RUNNER_TEMP/old.html"
      - name: GitHub sync safety
        run: node tests/sync-guard.js
      - name: Everyday fixes
        run: node tests/polish.js
      - name: Version was bumped (needed for phones to pick up the update)
        run: |
          old=$(grep -o 'const VERSION = "v[^"]*"' "$RUNNER_TEMP/old.html")
          new=$(grep -o 'const VERSION = "v[^"]*"' index.html)
          echo "main: $old  this PR: $new"
          if [ "$old" = "$new" ] && ! git diff --quiet origin/main -- index.html; then echo "index.html changed but VERSION did not"; exit 1; fi

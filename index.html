<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ascend</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Ascend">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#fbf9f5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111614" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&display=swap">
<style>
/* Layout: single phone column, sticky date header, fixed bottom tab bar; items are quiet rows, the goal link is the one secondary line. */
:root {
  --bg: #fbf9f5;
  --surface: #ffffff;
  --ink: #1d2321;
  --muted: #66706c;
  --line: #ebe6dd;
  --accent: #127a5c;
  --accent-bright: #21a366;
  --accent-soft: #e3f4ea;
  --accent-ink: #ffffff;
  --warn: #a8560d;
  --warn-soft: #fdeedd;
  --rest: #6a6f86;
  --rest-soft: #ecedf5;
  --sunny: #fff6dc;
  --font-display: "Bricolage Grotesque", ui-rounded, -apple-system, "Segoe UI", sans-serif;
  --font-body: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
  --radius: 18px;
  --shadow: 0 1px 2px rgba(60, 45, 20, .04), 0 4px 14px rgba(60, 45, 20, .05);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111614; --surface: #1a211e; --ink: #e9eeec; --muted: #9faba7; --line: #2a3330;
    --accent: #63c7a2; --accent-bright: #4fd19c; --accent-soft: #1d342b; --accent-ink: #0b1210;
    --warn: #f0b066; --warn-soft: #33261a; --rest: #a6aac4; --rest-soft: #23253a; --sunny: #2c2717;
    --shadow: none;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111614; --surface: #1a211e; --ink: #e9eeec; --muted: #9faba7; --line: #2a3330;
  --accent: #63c7a2; --accent-bright: #4fd19c; --accent-soft: #1d342b; --accent-ink: #0b1210;
  --warn: #f0b066; --warn-soft: #33261a; --rest: #a6aac4; --rest-soft: #23253a; --sunny: #2c2717;
  --shadow: none;
  color-scheme: dark;
}
* { box-sizing: border-box; }
:root { padding-top: env(safe-area-inset-top, 0px); }
body { margin: 0; }
[hidden] { display: none !important; }
html, body { background: var(--bg); }
body { color: var(--ink); font-family: var(--font-body); font-size: 16px; line-height: 1.45; -webkit-tap-highlight-color: transparent; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.wrap { max-width: 560px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0 calc(160px + env(safe-area-inset-bottom, 0px)); }
header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); padding-block: 14px 10px; display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; }
h1 { font-family: var(--font-display); font-weight: 700; font-size: 30px; line-height: 1.1; margin: 0; letter-spacing: -0.01em; text-wrap: balance; }
.eyebrow { font-size: 12px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); margin: 0 0 2px; }
.sync { font-size: 12px; color: var(--muted); white-space: nowrap; }
h2 { font-family: var(--font-display); font-weight: 500; font-size: 19px; margin: 26px 0 10px; display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
h2 small { font-family: var(--font-body); font-size: 13px; color: var(--muted); font-weight: 400; font-variant-numeric: tabular-nums; }
.list { display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow); }
.row { display: flex; align-items: center; gap: 12px; padding: 12px 14px; min-height: 60px; border-top: 1px solid var(--line); }
.row:first-child { border-top: 0; }
.row .main { flex: 1; min-width: 0; }
.row .title { font-weight: 600; overflow-wrap: anywhere; }
.row .sub { font-size: 13px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px 10px; font-variant-numeric: tabular-nums; }
.row.done .title { color: var(--muted); text-decoration: line-through; text-decoration-color: var(--line); }
.check { --c: var(--accent-bright); --ci: #fff; flex: none; width: 44px; height: 44px; border-radius: 50%; border: 2.5px solid color-mix(in srgb, var(--c) 55%, var(--line)); background: transparent; display: grid; place-items: center; cursor: pointer; color: var(--ci); -webkit-touch-callout: none; user-select: none; }
.check svg { width: 20px; height: 20px; opacity: 0; }
.check[aria-pressed="true"] { background: var(--c); border-color: var(--c); }
.check[aria-pressed="true"] svg { opacity: 1; }
.check.rest { border-style: dashed; border-color: var(--rest); color: var(--rest); }
.check.rest svg { display: none; }
.check.rest::after { content: "Rest"; font-size: 11px; font-weight: 600; }
.chip { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; padding: 1px 8px; border-radius: 99px; background: var(--accent-soft); color: var(--accent); font-weight: 600; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chip.warn { background: var(--warn-soft); color: var(--warn); }
.chip.rest { background: var(--rest-soft); color: var(--rest); }
.mini { font: inherit; font-size: 13px; font-weight: 600; color: var(--accent); background: transparent; border: 0; padding: 10px 6px; min-height: 44px; cursor: pointer; }
.mini.muted { color: var(--muted); }
.mini.danger { color: var(--warn); }
.dots { display: flex; gap: 3px; align-items: center; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--line); }
.dot.on { background: var(--c, var(--accent-bright)); }
.dot.rest { background: transparent; border: 1.5px dashed var(--rest); }
.dot.off { background: transparent; border: 1.5px solid var(--line); }
.goal { padding: 14px; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 8px; }
.goal:first-child { border-top: 0; }
.goal .top { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; }
.goal .num { font-variant-numeric: tabular-nums; font-size: 14px; color: var(--muted); white-space: nowrap; }
.bar { height: 8px; border-radius: 99px; background: color-mix(in srgb, var(--c, var(--accent-bright)) 16%, transparent); overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--c, var(--accent-bright)); border-radius: 99px; }
.pace { font-size: 13px; color: var(--muted); }
.empty { padding: 18px 14px; color: var(--muted); font-size: 15px; }
.summary { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 4px; }
.summary div { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); padding: 10px 12px; min-width: 0; }
.summary b { display: block; font-family: var(--font-display); font-size: 22px; font-variant-numeric: tabular-nums; }
.summary span { font-size: 12px; color: var(--muted); }
form.card, .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: 14px; display: flex; flex-direction: column; gap: 12px; }
label { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--muted); font-weight: 600; }
input, select, textarea { font: inherit; font-size: 16px; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; min-height: 44px; width: 100%; }
textarea { min-height: 140px; font-family: ui-monospace, Menlo, monospace; font-size: 12px; }
.fields { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.fields > * { min-width: 0; }
.days { display: flex; gap: 6px; flex-wrap: wrap; }
.days button { font: inherit; font-size: 13px; font-weight: 600; width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--line); background: var(--bg); color: var(--muted); cursor: pointer; }
.days button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn { font: inherit; font-weight: 700; min-height: 46px; border-radius: 14px; border: 0; background: var(--accent); color: var(--accent-ink); padding: 0 18px; cursor: pointer; }
.btn.ghost { background: transparent; color: var(--accent); border: 1px solid var(--line); }
.btn.danger { background: var(--warn); color: var(--surface); }
.btns { display: flex; gap: 8px; flex-wrap: wrap; }
.hint { font-size: 13px; color: var(--muted); margin: 0; }
.err { font-size: 13px; color: var(--warn); margin: 0; }
.add { margin-top: 10px; }
nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: max(8px, env(safe-area-inset-left, 0px)); padding-right: max(8px, env(safe-area-inset-right, 0px)); }
nav.tabs .in { max-width: 560px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, 1fr); }
nav.tabs button { font: inherit; font-size: 11px; font-weight: 600; background: none; border: 0; color: var(--muted); padding: 8px 0 10px; min-height: 56px; display: flex; flex-direction: column; align-items: center; gap: 3px; cursor: pointer; }
nav.tabs button svg { width: 22px; height: 22px; }
nav.tabs button[aria-current="page"] { color: var(--accent); }
.welcome { margin-top: 18px; display: flex; flex-direction: column; gap: 14px; }
.welcome p { margin: 0; color: var(--muted); max-width: 60ch; }
.proto { margin-top: 28px; font-size: 12px; color: var(--muted); text-align: center; }
button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
@media (prefers-reduced-motion: no-preference) { .bar > i { transition: width .3s ease; } .check { transition: background .15s, border-color .15s; } }
.strip { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin-top: 14px; }
.strip button { font: inherit; font-size: 12px; font-weight: 600; min-height: 52px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); color: var(--muted); cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.2; font-variant-numeric: tabular-nums; padding: 0; }
.strip button b { font-size: 15px; color: var(--ink); }
.strip button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.strip button[aria-pressed="true"] b { color: var(--accent-ink); }
.note { margin: 10px 0 0; padding: 10px 12px; border-radius: 12px; background: var(--accent-soft); color: var(--ink); font-size: 14px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.linkish { font: inherit; font-weight: 600; color: var(--ink); background: none; border: 0; padding: 0; text-align: left; cursor: pointer; overflow-wrap: anywhere; }
.cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
.cal .h { font-size: 11px; font-weight: 600; color: var(--muted); text-align: center; padding-bottom: 2px; }
.cal button { font: inherit; font-size: 14px; font-variant-numeric: tabular-nums; aspect-ratio: 1; min-height: 40px; width: 100%; border-radius: 50%; border: 1.5px solid transparent; background: transparent; color: var(--ink); cursor: pointer; padding: 0; }
.cal button.on { background: var(--c, var(--accent)); color: var(--ci, var(--accent-ink)); }
.cal button.rest { border-style: dashed; border-color: var(--rest); color: var(--rest); }
.cal button.off { border-color: var(--line); }
.cal button.na { color: var(--muted); }
.cal button.today { font-weight: 800; text-decoration: underline; text-underline-offset: 3px; }
.cal button:disabled { color: var(--line); cursor: default; }
.calhead { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.calhead b { font-family: var(--font-display); font-weight: 500; font-size: 17px; }
.summary.four { grid-template-columns: repeat(2, 1fr); }
@media (min-width: 420px) { .summary.four { grid-template-columns: repeat(4, 1fr); } }
@media (max-width: 380px) { .fields { grid-template-columns: 1fr; } h1 { font-size: 26px; } }

/* v1.4: brighter look, goal-first Today, check-off feedback */
.hello { display: flex; align-items: center; justify-content: space-between; gap: 14px; margin: 4px 0 2px; padding: 14px 16px; border-radius: var(--radius); background: linear-gradient(135deg, var(--sunny), var(--accent-soft)); }
.hello p { margin: 0; font-size: 15px; }
.hello p b { font-family: var(--font-display); font-weight: 700; font-size: 17px; display: block; }
.ring { flex: none; width: 58px; height: 58px; position: relative; }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring span { position: absolute; inset: 0; display: grid; place-items: center; font-weight: 700; font-size: 14px; font-variant-numeric: tabular-nums; }
.goalstrip { display: flex; gap: 10px; overflow-x: auto; margin: 14px -16px 0; padding: 2px 16px 6px; scroll-snap-type: x proximity; scroll-padding-inline: 16px; scrollbar-width: none; }
.goalstrip::-webkit-scrollbar { display: none; }
.gcard { --c: var(--accent-bright); flex: 0 0 auto; width: 150px; scroll-snap-align: start; text-align: left; font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-top: 4px solid var(--c); border-radius: 16px; padding: 10px 12px; box-shadow: var(--shadow); cursor: pointer; display: flex; flex-direction: column; gap: 6px; }
.gcard[aria-pressed="true"] { background: color-mix(in srgb, var(--c) 12%, var(--surface)); border-color: var(--c); }
.gcard .gname { font-weight: 700; font-size: 14px; line-height: 1.25; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; min-height: 2.5em; }
.gcard .bar { display: block; }
.gcard .gfoot { display: flex; justify-content: space-between; align-items: baseline; font-size: 12px; color: var(--muted); gap: 6px; }
.gcard .gfoot b { color: var(--ink); font-size: 14px; font-variant-numeric: tabular-nums; }
.paceword { font-size: 12px; font-weight: 600; white-space: nowrap; }
.paceword.ahead, .paceword.ontrack, .paceword.done { color: var(--accent); }
.paceword.behind { color: var(--warn); }
.ghead { font-family: var(--font-body); display: flex; justify-content: flex-start; align-items: center; gap: 8px; margin: 22px 2px 8px; font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.ghead i { width: 10px; height: 10px; border-radius: 50%; background: var(--c, var(--line)); flex: none; }
.ghead .em { font-size: 15px; letter-spacing: 0; }
.row.slim { min-height: 56px; padding: 6px 14px 6px 8px; }
.row.slim .title { font-weight: 500; }
.row .em { margin-right: 6px; }
.row .stat { flex: none; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; text-align: right; max-width: 45%; }
.row .stat.warn { color: var(--warn); font-weight: 600; }
.row .stat.hi { color: var(--warn); font-weight: 700; }
.fold { font: inherit; font-size: 14px; font-weight: 600; color: var(--muted); background: none; border: 0; padding: 14px 2px 6px; min-height: 44px; cursor: pointer; }
.focusbar { margin: 12px 0 0; display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 14px; }
.tip { font-size: 13px; color: var(--muted); margin: 10px 2px 0; }
.swatches { display: flex; flex-wrap: wrap; gap: 8px; }
.swatches button { width: 36px; height: 36px; border-radius: 50%; border: 3px solid var(--surface); background: var(--c); box-shadow: 0 0 0 1px var(--line); cursor: pointer; padding: 0; font-size: 12px; color: var(--muted); }
.swatches button.none { background: var(--bg); }
.swatches button[aria-checked="true"] { box-shadow: 0 0 0 2.5px var(--ink); }
.emojis { display: flex; flex-wrap: wrap; gap: 6px; }
.emojis button { width: 40px; height: 40px; border-radius: 12px; border: 1px solid var(--line); background: var(--bg); font-size: 20px; cursor: pointer; padding: 0; }
.emojis button[aria-checked="true"] { border-color: var(--ink); background: var(--accent-soft); }
.toast { position: fixed; left: 50%; bottom: calc(146px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 20; width: min(528px, calc(100% - 32px)); display: flex; align-items: center; gap: 10px; padding: 10px 10px 10px 16px; border-radius: 16px; background: var(--ink); color: var(--bg); box-shadow: 0 8px 28px rgba(0,0,0,.18); font-size: 15px; }
.toast span { flex: 1; min-width: 0; }
.toast button { font: inherit; font-weight: 700; color: var(--accent-bright); background: none; border: 0; padding: 8px 10px; min-height: 40px; cursor: pointer; }
.confetti { position: fixed; inset: 0; pointer-events: none; z-index: 30; overflow: hidden; }
.confetti i { position: absolute; top: -12px; width: 8px; height: 12px; border-radius: 2px; opacity: .95; }
@media (prefers-reduced-motion: no-preference) {
  .check.pop { animation: pop .35s ease; }
  @keyframes pop { 0% { transform: scale(.8); } 60% { transform: scale(1.12); } 100% { transform: scale(1); } }
  .toast { animation: rise .25s ease; }
  @keyframes rise { from { opacity: 0; transform: translate(-50%, 12px); } to { opacity: 1; transform: translate(-50%, 0); } }
  .confetti i { animation: fall 1.6s ease-in forwards; }
  @keyframes fall { to { transform: translateY(105vh) rotate(540deg); opacity: .9; } }
}
/* v1.5: + button, sheets, swipe rows, time of day, goal trend, habit strength */
.fab { position: fixed; right: max(18px, calc(50% - 262px)); bottom: calc(74px + env(safe-area-inset-bottom, 0px)); z-index: 15; width: 60px; height: 60px; border-radius: 50%; border: 0; background: var(--accent); color: var(--accent-ink); box-shadow: 0 6px 20px rgba(18, 122, 92, .35); display: grid; place-items: center; cursor: pointer; }
.fab svg { width: 28px; height: 28px; }
.sheet-wrap { position: fixed; inset: 0; z-index: 40; display: flex; align-items: flex-end; justify-content: center; }
.sheet-bg { position: absolute; inset: 0; background: rgba(25, 20, 10, .38); border: 0; padding: 0; cursor: pointer; }
.sheet { position: relative; width: 100%; max-width: 560px; max-height: 90vh; overflow-y: auto; overscroll-behavior: contain; background: var(--bg); border-radius: 26px 26px 0 0; padding: 8px 16px calc(22px + env(safe-area-inset-bottom, 0px)); box-shadow: 0 -10px 40px rgba(0,0,0,.18); }
.sheet .grab { width: 40px; height: 5px; border-radius: 3px; background: var(--line); margin: 0 auto 4px; }
.sheet h2 { margin-top: 10px; }
.sheet form.card, .sheet .card { border: 0; box-shadow: none; background: transparent; padding: 0; }
html.sheet-open, html.sheet-open body { overflow: hidden; }
.parse { display: flex; flex-wrap: wrap; gap: 6px; min-height: 24px; }
.parse .chip { font-size: 13px; padding: 3px 10px; }
.moreadd { display: flex; flex-wrap: wrap; gap: 8px; }
.srow { position: relative; overflow: hidden; touch-action: pan-y; border-top: 1px solid var(--line); }
.srow:first-child { border-top: 0; }
.srow > .row { border-top: 0; background: var(--surface); position: relative; z-index: 1; }
.srow .acts { position: absolute; inset: 0 0 0 auto; display: flex; z-index: 0; }
.srow .acts button { font: inherit; font-size: 13px; font-weight: 700; border: 0; width: 76px; color: #fff; cursor: pointer; }
.srow .acts .a1 { background: var(--rest); }
.srow .acts .a2 { background: var(--accent); }
.seg { display: inline-flex; margin-top: 14px; padding: 3px; border-radius: 12px; background: color-mix(in srgb, var(--line) 70%, transparent); gap: 2px; }
.seg button { font: inherit; font-size: 13px; font-weight: 600; border: 0; background: transparent; color: var(--muted); padding: 6px 12px; border-radius: 9px; min-height: 34px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }
.ghead .now { margin-left: 6px; font-size: 11px; letter-spacing: 0; text-transform: none; color: var(--accent); background: var(--accent-soft); padding: 1px 8px; border-radius: 99px; }
.trend { display: block; width: 100%; height: 64px; }
.trendaxis { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); margin-top: -2px; }
.heat { display: grid; grid-template-rows: repeat(7, 1fr); grid-auto-flow: column; grid-auto-columns: 1fr; gap: 3px; }
.heat i { aspect-ratio: 1; border-radius: 3px; background: color-mix(in srgb, var(--line) 45%, transparent); }
.heat i.on { background: var(--c, var(--accent-bright)); }
.heat i.miss { background: var(--line); }
.heat i.rest { background: transparent; box-shadow: inset 0 0 0 1.5px var(--rest); }
.heat i.fut { background: transparent; }
.heatkey { display: flex; gap: 12px; flex-wrap: wrap; font-size: 12px; color: var(--muted); align-items: center; }
.heatkey i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 4px; vertical-align: -1px; }
.strength { display: flex; align-items: center; gap: 14px; }
.strength .ring { width: 72px; height: 72px; }
.strength p { margin: 0; }
@media (prefers-reduced-motion: no-preference) {
  .sheet { animation: sheetup .22s ease; }
  @keyframes sheetup { from { transform: translateY(40px); opacity: .6; } to { transform: none; opacity: 1; } }
  .srow > .row.snap { transition: transform .18s ease; }
}
</style>
</head>
<body>


<div class="wrap">
  <header class="top">
    <div>
      <p class="eyebrow" id="eyebrow">Today</p>
      <h1 id="heading">Ascend</h1>
    </div>
    <span class="sync" id="sync" hidden>Loading…</span>
  </header>
  <div id="report"></div>
  <main id="view"></main>
</div>

<button type="button" class="fab" id="fab" data-act="openForm" data-form="add" aria-label="Add a task, habit or goal"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
<div id="sheet"></div>
<nav class="tabs" aria-label="Sections">
  <div class="in">
    <button type="button" data-tab="today"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>Today</button>
    <button type="button" data-tab="goals"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M3 20l6-11 4 6 3-4 5 9z"/></svg>Goals</button>
    <button type="button" data-tab="habits"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 12a8 8 0 1 0 3-6.2"/><path d="M4 4v4h4"/></svg>Habits</button>
    <button type="button" data-tab="tasks"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 6h11M9 12h11M9 18h11"/><path d="M4 6l1 1 2-2M4 12l1 1 2-2M4 18l1 1 2-2"/></svg>Tasks</button>
    <button type="button" data-tab="more"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/></svg>More</button>
  </div>
</nav>

<script>
(() => {
  // ---------- Calendar days: local DayKeys, never seconds / 86400 ----------
  const pad = n => String(n).padStart(2, "0");
  const dk = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  const parse = k => { const [y, m, d] = k.split("-").map(Number); return new Date(y, m - 1, d, 12); };
  const addDays = (k, n) => { const d = parse(k); d.setDate(d.getDate() + n); return dk(d); };
  const weekday = k => parse(k).getDay();
  const today = () => dk(new Date());
  const weekStart = k => addDays(k, -((weekday(k) + 6) % 7));
  const daysBetween = (a, b) => { let n = 0, k = a; if (a <= b) { while (k < b) { k = addDays(k, 1); n++; } return n; } while (k > b) { k = addDays(k, -1); n--; } return n; };
  const fmtDay = k => parse(k).toLocaleDateString(undefined, { weekday: "short", day: "numeric", month: "short" });
  const DAY_LETTERS = ["Su", "Mo", "Tu", "We", "Th", "Fr", "Sa"];
  const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

  // ---------- State ----------
  const VERSION = "v1.5-web";
  const ISSUES = "https://github.com/belipede/ascend-web/issues";
  const EMPTY = () => ({ v: 1, goals: [], habits: [], tasks: [], logs: {}, entries: [], opens: {}, trialStart: null, savedAt: 0 });
  let FB = { col: null, list: [], open: false, kind: "bug", text: "", sent: "", err: "" };
  let S = null;
  let tab = "today";
  let ui = { form: null, confirm: null, importText: "", importErr: "", exportShown: false, msg: "", day: null, detail: null, calMonth: null, showArchived: false, scroll: false };

  function validate(o) {
    if (!o || typeof o !== "object") throw new Error("That isn't an Ascend export.");
    for (const f of ["goals", "habits", "tasks", "entries"]) if (!Array.isArray(o[f])) throw new Error(`Missing the "${f}" list.`);
    if (!o.logs || typeof o.logs !== "object") throw new Error('Missing the "logs" section.');
    const keyOk = k => /^\d{4}-\d{2}-\d{2}$/.test(k);
    for (const h of o.habits) if (!h.id || !h.name) throw new Error("A habit is missing its id or name.");
    for (const h of o.habits) if (h.perWeek != null && !(Number.isInteger(Number(h.perWeek)) && h.perWeek >= 0 && h.perWeek <= 7)) throw new Error(`"${h.name}" has a bad times-per-week value.`);
    for (const h of o.habits) if (h.times != null && Number(h.times) > 0 && !(Number.isInteger(Number(h.every)) && h.every >= 1 && h.every <= 365 && Number.isInteger(Number(h.times)) && h.times <= h.every && keyOk(String(h.anchor)))) throw new Error(`"${h.name}" has a bad times-every-N-days value.`);
    // Older exports stored "N times a week" as perWeek. It becomes N times every 7 days, counted from a Monday as before.
    for (const h of o.habits) if (Number(h.perWeek) > 0 && !(Number(h.times) > 0)) { const s0 = keyOk(String(h.startDay)) ? h.startDay : today(); Object.assign(h, { times: Number(h.perWeek), every: 7, anchor: weekStart(s0) }); delete h.perWeek; }
    for (const x of [...o.habits, ...o.tasks]) if (x.part != null && !PARTS[x.part]) delete x.part;
    for (const x of [...o.goals, ...o.habits]) { if (x.color != null && !COLORS[x.color]) delete x.color; if (x.emoji != null && typeof x.emoji !== "string") delete x.emoji; }
    for (const g of o.goals) if (!g.id || !g.name || !(Number(g.target) > 0)) throw new Error("A goal is missing its id, name or target.");
    for (const t of o.tasks) if (!t.id || !t.title) throw new Error("A task is missing its id or title.");
    for (const [hid, days] of Object.entries(o.logs)) for (const [k, v] of Object.entries(days)) if (!keyOk(k) || !["done", "rest"].includes(v)) throw new Error(`Bad log entry for ${hid} on ${k}.`);
    return { v: 1, goals: o.goals, habits: o.habits, tasks: o.tasks, logs: o.logs, entries: o.entries, started: !!o.started, opens: (o.opens && typeof o.opens === "object") ? o.opens : {}, trialStart: o.trialStart || null, savedAt: Number(o.savedAt) || 0 };
  }

  // ---------- Storage: account db when available, this-device cache always ----------
  const LS = "ascend-proto-v1";
  let ref = null, writing = false, pending = false, timer = null, lastWritten = 0;
  const syncEl = document.getElementById("sync");
  const setSync = t => { syncEl.textContent = t; };

  function cacheLocal() { try { localStorage.setItem(LS, JSON.stringify(S)); } catch (e) {} }
  function readLocal() { try { const t = localStorage.getItem(LS); return t ? validate(JSON.parse(t)) : null; } catch (e) { return null; } }

  function save() {
    S.savedAt = Date.now();
    cacheLocal();
    if (!ref) { setSync("Saved on this device"); return; }
    setSync("Saving…");
    clearTimeout(timer);
    timer = setTimeout(flush, 500);
  }
  async function flush() {
    if (!ref) return;
    if (writing) { pending = true; return; }
    writing = true;
    const snapshot = JSON.stringify(S);
    try {
      await ref.set({ json: snapshot, savedAt: S.savedAt });
      lastWritten = S.savedAt;
      setSync("Saved to your account");
    } catch (e) {
      setSync(e && e.code === "quota_exceeded" ? "Account storage full, saved on this device" : "Not saved to account, kept on this device");
    } finally {
      writing = false;
      if (pending) { pending = false; flush(); }
    }
  }

  async function connect() {
    try {
      if (!window.claude?.use) { setSync("Saved on this device"); return; }
      const [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
      const id = user ? await user.id() : null;
      if (!db || !id) { setSync("Saved on this device"); return; }
      ref = db.doc("data/users/" + id + "/ascend");
      FB.col = db.collection("feedback");
      try { FB.col.orderBy("createdAt", "desc").limit(50).onSnapshot(q => { FB.list = q.docs.map(d => ({ id: d.id, ...d.data })); renderReport(); if (tab === "more") render(); }, () => {}); } catch (e) {}
      renderReport();
      const snap = await ref.get();
      if (snap.exists && snap.data && typeof snap.data.json === "string") {
        const remote = validate(JSON.parse(snap.data.json));
        if (!S || remote.savedAt >= (S.savedAt || 0)) { S = remote; cacheLocal(); render(); }
        else flush();
        lastWritten = remote.savedAt;
        setSync("Saved to your account");
      } else if (S && hasData()) { flush(); }
      else setSync("Saved to your account");
      ref.onSnapshot(s => {
        if (!s.exists || typeof s.data?.json !== "string") return;
        const at = Number(s.data.savedAt) || 0;
        if (at > (S?.savedAt || 0) && at !== lastWritten) {
          try { S = validate(JSON.parse(s.data.json)); cacheLocal(); render(); } catch (e) {}
        }
      }, () => {});
    } catch (e) {
      ref = null;
      setSync("Saved on this device");
    }
  }
  const hasData = () => S && (S.goals.length || S.habits.length || S.tasks.length);

  // ---------- Derived values ----------
  const goalById = id => S.goals.find(g => g.id === id);
  const scheduled = (h, k) => !h.days || h.days.length === 0 || h.days.includes(weekday(k));
  const logOf = (h, k) => (S.logs[h.id] || {})[k];
  // Count habits: "times" check-ins in each block of "every" days. Blocks run back to back from the anchor day.
  const isCount = h => Number(h.times) > 0;
  const isCalWeek = h => Number(h.every) === 7 && weekday(h.anchor) === 1;
  function periodStart(h, k) {
    const n = Number(h.every); let s = h.anchor;
    if (s <= k) { for (let nx = addDays(s, n); nx <= k; nx = addDays(nx, n)) s = nx; }
    else while (s > k) s = addDays(s, -n);
    return s;
  }
  // A rest day lowers that period's target so it never counts against you.
  function progressFrom(h, s) {
    const n = Number(h.every); let done = 0, rests = 0;
    for (let i = 0; i < n; i++) { const l = logOf(h, addDays(s, i)); if (l === "done") done++; else if (l === "rest") rests++; }
    return { done, target: Math.min(Number(h.times), n - rests), start: s, end: addDays(s, n - 1) };
  }
  const periodProgress = (h, k) => progressFrom(h, periodStart(h, k));
  const runUnit = h => isCalWeek(h) ? "weeks" : "periods";
  // "this week", "· 4 days left", or "· by Tue 4 Nov" for a past day.
  function periodLeft(h, k, p) {
    if (isCalWeek(h)) return "this week";
    if (k !== today()) return `· by ${fmtDay(p.end)}`;
    const left = daysBetween(k, p.end) + 1;
    return left === 1 ? "· last day" : `· ${left} days left`;
  }
  const viewDay = () => { const t = today(); return ui.day && ui.day < t && ui.day >= addDays(t, -6) ? ui.day : t; };

  function habitWindow(h, n = 7) {
    const t = today(), out = [];
    for (let i = n - 1; i >= 0; i--) {
      const k = addDays(t, -i);
      if (h.startDay && k < h.startDay) { out.push({ k, s: "none" }); continue; }
      if (!scheduled(h, k)) { out.push({ k, s: "none" }); continue; }
      const l = logOf(h, k);
      out.push({ k, s: l === "done" ? "on" : l === "rest" ? "rest" : (k === t ? "open" : isCount(h) ? "none" : "off") });
    }
    return out;
  }
  function habitStats(h) {
    const w = habitWindow(h, 7);
    const done = w.filter(x => x.s === "on").length;
    const counted = w.filter(x => x.s === "on" || x.s === "off").length;
    const { cur, best } = habitRuns(h);
    return { w, done, counted, run: cur, best };
  }
  const firstDay = h => { const keys = Object.keys(S.logs[h.id] || {}).sort(); const s0 = h.startDay || keys[0] || today(); return keys[0] && keys[0] < s0 ? keys[0] : s0; };
  // Runs: daily habits count scheduled, non-rest days done in a row; count habits count periods that met their target.
  // Today (or the current period) only adds to a run once done; it never breaks one.
  function habitRuns(h) {
    const t = today(); let cur = 0, best = 0, guard = 0;
    if (isCount(h)) {
      const now = periodStart(h, t), n = Number(h.every);
      for (let s = periodStart(h, firstDay(h)); s <= now && guard++ < 5000; s = addDays(s, n)) {
        const p = progressFrom(h, s);
        if (p.target === 0) continue;
        if (p.done >= p.target) { cur++; best = Math.max(best, cur); }
        else if (s !== now) cur = 0;
      }
    } else {
      for (let k = firstDay(h); k <= t && guard++ < 5000; k = addDays(k, 1)) {
        const l = logOf(h, k);
        if (!scheduled(h, k) || l === "rest") continue;
        if (l === "done") { cur++; best = Math.max(best, cur); }
        else if (k !== t) cur = 0;
      }
    }
    return { cur, best };
  }
  function habitTotals(h) {
    const t = today(), logs = S.logs[h.id] || {}, start = firstDay(h);
    const total = Object.values(logs).filter(v => v === "done").length;
    let done30 = 0, counted30 = 0;
    for (let i = 0; i < 30; i++) {
      const k = addDays(t, -i), l = logs[k];
      if (l === "done") done30++;
      if (k < start || !scheduled(h, k) || l === "rest") continue;
      if (l === "done" || k !== t) counted30++;
    }
    return { total, done30, counted30 };
  }
  function goalProgress(g) {
    let p = 0;
    for (const e of S.entries) if (e.goalId === g.id) p += Number(e.amount) || 0;
    for (const h of S.habits) if (h.goalId === g.id) {
      const n = Object.values(S.logs[h.id] || {}).filter(v => v === "done").length;
      p += n * (Number(h.amount) || 0);
    }
    for (const t of S.tasks) if (t.goalId === g.id && t.done) p += Number(t.amount) || 0;
    return p;
  }
  // Money units show as a prefix ("$1,500"); everything else as "16 books". Big numbers drop decimals.
  const CUR = { "$": "$", "usd": "$", "sgd": "S$", "s$": "S$", "aud": "A$", "€": "€", "eur": "€", "£": "£", "gbp": "£", "¥": "¥" };
  const isCur = unit => !!CUR[String(unit || "").trim().toLowerCase()];
  const fmtNum = n => { n = Number(n) || 0; const r = Math.abs(n) >= 100 ? Math.round(n) : Math.round(n * 10) / 10; return r.toLocaleString(undefined, { maximumFractionDigits: 1 }); };
  function fmtAmt(n, unit) {
    const u = String(unit || "").trim(), c = CUR[u.toLowerCase()];
    return c ? `${n < 0 ? "-" : ""}${c}${fmtNum(Math.abs(n))}` : `${fmtNum(n)}${u ? " " + esc(u) : ""}`;
  }
  // "16 of 24 books" or "$1,500 of $5,000"
  const ofTarget = (g, p) => `${isCur(g.unit) ? fmtAmt(p, g.unit) : fmtNum(p)} of ${fmtAmt(Number(g.target), g.unit)}`;
  function pace(g, p) {
    if (!g.deadline) return "";
    const left = daysBetween(today(), g.deadline);
    const remaining = Math.max(0, g.target - p);
    if (remaining === 0) return "Target reached. Brilliant work!";
    if (left < 0) return `Deadline was ${fmtDay(g.deadline)}. Keep going or set a new date.`;
    if (left === 0) return `${fmtAmt(remaining, g.unit)} to go, due today`;
    const perWeek = remaining / left * 7, perDay = remaining / left;
    return `${fmtAmt(remaining, g.unit)} to go in ${left} day${left === 1 ? "" : "s"} · about ${perWeek >= 1 ? fmtAmt(perWeek, g.unit) + " a week" : fmtAmt(perDay, g.unit) + " a day"}`;
  }
  // Compares progress with an even pace from the day the goal was made to its deadline.
  function paceStatus(g, p) {
    if (p >= Number(g.target)) return ["done", "Reached 🎉"];
    if (!g.deadline || !g.createdDay) return null;
    const total = daysBetween(g.createdDay, g.deadline), gone = daysBetween(g.createdDay, today());
    if (gone > total) return ["behind", "Past deadline"];
    if (total <= 0 || gone <= 0) return ["ontrack", "Just started"];
    const r = p / (g.target * gone / total);
    return r >= 1.1 ? ["ahead", "Ahead"] : r >= 0.9 ? ["ontrack", "On track"] : ["behind", "A bit behind"];
  }
  // Daily running total of a goal, from its first day (or first logged progress) to today.
  // Anything without a date is counted from the start, so the last point always equals goalProgress.
  function goalSeries(g) {
    const t = today(), ev = {}, keyOk = k => /^\d{4}-\d{2}-\d{2}$/.test(k || "") && k <= t;
    const add = (k, n) => { if (keyOk(k) && n) ev[k] = (ev[k] || 0) + n; };
    for (const e of S.entries) if (e.goalId === g.id) add(e.day, Number(e.amount) || 0);
    for (const h of S.habits) if (h.goalId === g.id && Number(h.amount)) for (const [k, v] of Object.entries(S.logs[h.id] || {})) if (v === "done") add(k, Number(h.amount));
    for (const x of S.tasks) if (x.goalId === g.id && x.done) add(x.doneOn, Number(x.amount) || 0);
    const total = goalProgress(g), keys = Object.keys(ev).sort();
    let start = [g.createdDay, keys[0]].filter(keyOk).sort()[0] || t;
    if (daysBetween(start, t) > 730) start = addDays(t, -730);
    let cum = total; for (const k of keys) if (k >= start) cum -= ev[k];
    const pts = []; for (let k = start; k <= t; k = addDays(k, 1)) { cum += ev[k] || 0; pts.push(cum); }
    return { start, pts };
  }
  // When the goal will be reached at the pace of the last 4 weeks (or since it started, if newer).
  function projection(g, ser) {
    const p = ser.pts.at(-1), left = Number(g.target) - p; if (left <= 0) return null;
    const w = Math.min(28, ser.pts.length - 1); if (w < 3) return "Keep logging for a few days to see when you'll get there.";
    const rate = (p - ser.pts.at(-1 - w)) / w;
    if (rate <= 0) return "No progress in the last few weeks yet. One small step gets it moving again.";
    const days = Math.ceil(left / rate); if (days > 3650) return "At this pace it's a long way off. A little more often makes a big difference.";
    const k = addDays(today(), days), dl = g.deadline;
    return `At your recent pace you'll get there around <b>${fmtDay(k)}</b>${dl ? (k <= dl ? ", before your deadline. 🎯" : `, a bit after ${fmtDay(dl)}. A small push closes the gap.`) : "."}`;
  }
  function trendSvg(g, ser) {
    const W = 300, H = 64, t = today(), end = g.deadline && g.deadline > t ? g.deadline : t;
    const span = Math.max(1, daysBetween(ser.start, end)), top = Math.max(Number(g.target), ...ser.pts) || 1;
    const X = i => (i / span * W).toFixed(1), Y = v => (H - 4 - v / top * (H - 8)).toFixed(1);
    const line = ser.pts.map((v, i) => `${X(i)},${Y(v)}`).join(" ");
    const ideal = g.deadline && g.deadline > ser.start ? `<line x1="0" y1="${Y(ser.pts[0])}" x2="${X(daysBetween(ser.start, g.deadline))}" y2="${Y(Number(g.target))}" stroke="var(--muted)" stroke-width="1.2" stroke-dasharray="4 4" vector-effect="non-scaling-stroke" opacity=".6"/>` : "";
    return `<svg class="trend" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="Progress over time for ${esc(g.name)}"><line x1="0" x2="${W}" y1="${Y(Number(g.target))}" y2="${Y(Number(g.target))}" stroke="var(--line)" stroke-width="1" vector-effect="non-scaling-stroke"/>${ideal}<polygon points="0,${H} ${line} ${X(ser.pts.length - 1)},${H}" fill="var(--c)" opacity=".14"/><polyline points="${line}" fill="none" stroke="var(--c)" stroke-width="2.5" stroke-linejoin="round" vector-effect="non-scaling-stroke"/></svg>
      <div class="trendaxis" aria-hidden="true"><span>${fmtDay(ser.start)}</span><span>${g.deadline && g.deadline > t ? "Deadline " + fmtDay(g.deadline) : "Today"}</span></div>`;
  }
  // Habit strength, 0–100: rises a little with each check-in and dips gently after a miss, so one
  // missed day never wipes it out. Rest days and unscheduled days don't count either way.
  function habitStrength(h) {
    const t = today(); let s = 0, guard = 0;
    if (isCount(h)) {
      const n = Number(h.every), now = periodStart(h, t);
      for (let p = periodStart(h, firstDay(h)); p <= now && guard++ < 3000; p = addDays(p, n)) {
        const pr = progressFrom(h, p); if (pr.target === 0) continue;
        const f = Math.min(1, pr.done / pr.target);
        if (p === now && f < 1) { s = Math.max(s, s * 0.75 + 0.25 * f); continue; }
        s = s * 0.75 + 0.25 * f;
      }
    } else {
      for (let k = firstDay(h); k <= t && guard++ < 5000; k = addDays(k, 1)) {
        if (!scheduled(h, k)) continue;
        const l = logOf(h, k); if (l === "rest" || (k === t && l !== "done")) continue;
        s = s * 0.93 + (l === "done" ? 0.07 : 0);
      }
    }
    return Math.round(s * 100);
  }
  function heatmap(h) {
    const t = today(), start = firstDay(h), weeks = 18, first = addDays(weekStart(t), -7 * (weeks - 1));
    let cells = "";
    for (let k = first, i = 0; i < weeks * 7; i++, k = addDays(k, 1)) {
      const l = logOf(h, k);
      const cls = k > t ? "fut" : l === "done" ? "on" : l === "rest" ? "rest" : k < start || !scheduled(h, k) || isCount(h) || k === t ? "" : "miss";
      cells += `<i class="${cls}" title="${fmtDay(k)}"></i>`;
    }
    return `<div class="heat" role="img" aria-label="Last ${weeks} weeks of ${esc(h.name)}, one square per day">${cells}</div>
      <div class="heatkey" aria-hidden="true"><span><i style="background:var(--c)"></i>Done</span><span><i style="box-shadow:inset 0 0 0 1.5px var(--rest)"></i>Rest</span><span><i style="background:var(--line)"></i>Missed</span></div>`;
  }
  const pctOf = g => Math.min(100, Math.round(goalProgress(g) / g.target * 100));

  // ---------- Time of day ----------
  const PARTS = { morning: "Morning", afternoon: "Afternoon", evening: "Evening" };
  const partNow = () => { const h = new Date().getHours(); return h < 12 ? "morning" : h < 17 ? "afternoon" : "evening"; };
  const partSelect = (v, id) => `<label for="${id}">Time of day<select id="${id}" name="part"><option value="">Anytime</option>${Object.entries(PARTS).map(([k, n]) => `<option value="${k}" ${v === k ? "selected" : ""}>${n}</option>`).join("")}</select></label>`;
  const UIKEY = "ascend-ui-v1";
  const uiPrefs = (() => { try { return JSON.parse(localStorage.getItem(UIKEY)) || {}; } catch (e) { return {}; } })();
  const saveUiPrefs = () => { try { localStorage.setItem(UIKEY, JSON.stringify(uiPrefs)); } catch (e) {} };

  // ---------- Quick add: "Call mum fri evening !high #family +1" ----------
  const MONTHS = ["jan", "feb", "mar", "apr", "may", "jun", "jul", "aug", "sep", "oct", "nov", "dec"];

  function parseQuick(raw, defDue) {

    take(/\s#([^\s#]+)/gi, m => { const q = m[1].toLowerCase(); const g = S.goals.filter(x => !x.archived).find(x => x.emoji === m[1] || x.name.toLowerCase().replace(/[^a-z0-9]/g, "").includes(q.replace(/[^a-z0-9]/g, "") || "\u0000")); if (!g) return false; goalId = g.id; return true; });

    take(/\s(?:on |by |due )?(?:tomorrow|tmrw|tmr|tomorow)(?=\s)/i, () => { due = addDays(t, 1); return true; });
    take(/\s(?:anytime|someday|no date)(?=\s)/i, () => { due = null; return true; });
    take(/\snext week(?=\s)/i, () => { due = addDays(weekStart(t), 7); return true; });
    take(/\sin (\d{1,3}) days?(?=\s)/i, m => { due = addDays(t, Number(m[1])); return true; });

  function quickAdd() {
    return `<form class="add" data-form="quick" style="margin-top:16px"><div style="display:flex;gap:8px"><label for="qa" style="flex:1"><span class="sr" hidden>Quick add task</span><input id="qa" name="title" placeholder="Add a task: buy milk tmr evening" maxlength="140" autocomplete="off" enterkeyhint="done" data-parse></label><button class="btn" type="submit" aria-label="Add task">Add</button></div><div class="parse" id="qa-parse" style="margin-top:6px" aria-live="polite"></div></form>`;
  }

  function lookPicker(x, inherit) {
    const cur = COLORS[x.color] ? x.color : "";
    const sw = (inherit ? [`<button type="button" class="none" role="radio" aria-checked="${!cur}" aria-label="Same as its goal" data-act="pickColor" data-id="">Auto</button>`] : [])
      .concat(COLOR_KEYS.map(k => `<button type="button" role="radio" aria-checked="${cur === k}" aria-label="${k}" style="${cvars(k)}" data-act="pickColor" data-id="${k}"></button>`));
    return `<input type="hidden" name="color" value="${cur}">
      <div><span class="hint" style="font-weight:600">Colour</span><div class="swatches" role="radiogroup" aria-label="Colour" style="margin-top:6px">${sw.join("")}</div></div>
      <div><span class="hint" style="font-weight:600">Emoji (optional)</span><div class="emojis" role="radiogroup" aria-label="Emoji" style="margin-top:6px">${EMOJIS.map(e => `<button type="button" role="radio" aria-checked="${x.emoji === e}" data-act="pickEmoji" data-id="${e}">${e}</button>`).join("")}<input name="emoji" aria-label="Or type an emoji" maxlength="16" value="${esc(x.emoji)}" style="width:72px;min-height:40px;padding:6px 10px;font-size:20px;text-align:center"></div></div>`;
  }
  const formBtns = (label, del) => `<div class="btns"><button class="btn" type="submit">${label}</button><button class="btn ghost" type="button" data-act="closeForm">Cancel</button>${del || ""}</div>`;
  function goalForm(g) {
    const e = !!g; g = g || {};
    return `${e ? "" : "<h2>New goal</h2>"}<form class="card" data-form="goal" data-id="${e ? g.id : ""}" data-autofocus${e ? ' style="border:0;padding:0"' : ""}>
      <label for="g-name">Goal<input id="g-name" name="name" required maxlength="80" placeholder="Read 24 books" value="${esc(g.name)}"></label>
      <div class="fields"><label for="g-target">Target<input id="g-target" name="target" type="number" inputmode="decimal" min="0.1" step="any" required placeholder="24" value="${esc(g.target)}"></label>
      <label for="g-unit">Unit<input id="g-unit" name="unit" maxlength="20" placeholder="books" value="${esc(g.unit)}"></label></div>
      <label for="g-deadline">Deadline (optional)<input id="g-deadline" name="deadline" type="date" value="${esc(g.deadline)}"></label>
      ${lookPicker(e ? { color: g.color, emoji: g.emoji } : { color: COLOR_KEYS[S.goals.length % COLOR_KEYS.length] }, false)}
      ${formBtns(e ? "Save goal" : "Create goal", e ? `<button type="button" class="btn ghost" style="color:var(--warn)" data-act="askDeleteGoal" data-id="${g.id}">Delete</button>` : "")}</form>`;
  }
  function renderGoals() {
    const goals = S.goals.filter(g => !g.archived), arch = S.goals.filter(g => g.archived);
    let h = goals.length ? `<div class="list">${goals.map(g => goalBlock(g, { detail: true })).join("")}</div>` : `<div class="list"><div class="empty">No goals yet. Pick something you would love to reach, like 24 books or 100 km. 🎯</div></div>`;
    h += confirmBox();
    h += `<div class="btns add"><button type="button" class="btn" data-act="openForm" data-form="goal">New goal</button></div>`;
    if (arch.length) h += archivedSection(arch.length, () => `<div class="list">${arch.map(g => goalBlock(g, { detail: true })).join("")}</div>`);
    h += `<p class="hint" style="margin-top:14px">Progress counts each logged entry once: manual entries, plus linked habit check-ins and finished tasks at the amount you set on them. Archived goals keep their progress and leave Today.</p>`;
    return h;
  }
  function archivedSection(n, body) {
    return `<h2>Archived <small><button type="button" class="mini" data-act="toggleArchived" aria-expanded="${ui.showArchived}" style="min-height:32px;padding:4px 0">${ui.showArchived ? "Hide" : `Show ${n}`}</button></small></h2>${ui.showArchived ? body() : ""}`;
  }

  let draftDays = [];
  function habitForm(x) {
    const e = !!x; x = x || { amount: 1 };
    return `${e ? "" : "<h2>New habit</h2>"}<form class="card" data-form="habit" data-id="${e ? x.id : ""}" data-autofocus>
      <label for="h-name">Habit<input id="h-name" name="name" required maxlength="80" placeholder="Read for 20 minutes" value="${esc(x.name)}"></label>
      <div><span class="hint" style="font-weight:600">Days (none selected = every day)</span><div class="days" style="margin-top:6px">${[1, 2, 3, 4, 5, 6, 0].map(i => `<button type="button" aria-pressed="${draftDays.includes(i)}" data-act="toggleDay" data-day="${i}" aria-label="${DAY_LETTERS[i]}">${DAY_LETTERS[i]}</button>`).join("")}</div></div>
      <div><span class="hint" style="font-weight:600">Or a number of times, on any days</span>
      <div class="fields" style="margin-top:6px"><label for="h-times">Times<select id="h-times" name="times"><option value="0">Use the days above</option>${Array.from({ length: 20 }, (_, i) => i + 1).map(n => `<option value="${n}" ${Number(x.times) === n ? "selected" : ""}>${n}×</option>`).join("")}</select></label>
      <label for="h-every">Every (days)<input id="h-every" name="every" type="number" inputmode="numeric" min="2" max="365" step="1" value="${esc(isCount(x) ? x.every : 7)}"></label></div>
      <p class="hint" style="margin-top:6px">For example 3× every 10 days. The count starts again every 10 days, from the day you save${e && isCount(x) ? " (or keeps its current timing if you don't change the days)" : ""}.</p></div>
      <div class="fields"><label for="h-goal">Counts toward<select id="h-goal" name="goalId">${goalOptions(x.goalId || "")}</select></label>
      <label for="h-amt">Amount per check-in<input id="h-amt" name="amount" type="number" inputmode="decimal" step="any" min="0" value="${esc(x.goalId || !e ? x.amount || 1 : 1)}"></label></div>
      ${partSelect(x.part, "h-part")}
      ${lookPicker(x, true)}
      ${e ? `<p class="hint">Changing the goal or amount also changes what past check-ins added to goals. Check-in history stays.</p>` : ""}
      ${formBtns(e ? "Save habit" : "Create habit")}</form>`;
  }
  function renderHabits() {
    const det = ui.detail && S.habits.find(x => x.id === ui.detail);
    if (det) return renderHabitDetail(det);
    const row = x => {
      const st = habitStats(x);
      const pp = isCount(x) && periodProgress(x, today());
      const prog = pp ? `<span>${pp.done} of ${pp.target} ${periodLeft(x, today(), pp)}</span>` : `${dotsHtml(st.w)}<span>${st.done} of ${st.counted} last 7</span>`;
      return `<div class="row" style="${cvars(itemColor(x))}"><span class="ghead" style="margin:0" aria-hidden="true"><i></i></span><div class="main"><button type="button" class="linkish title" data-act="openHabit" data-id="${x.id}">${emojiOf(x)}${esc(x.name)}</button><div class="sub"><span>${schedText(x)}</span>${prog}${goalChip(x.goalId, amtTag(x))}</div></div>
        <button type="button" class="mini" data-act="openHabit" data-id="${x.id}" aria-label="Open ${esc(x.name)}">Open</button></div>`;
    };
    const hs = S.habits.filter(x => !x.archived), arch = S.habits.filter(x => x.archived);
    let h = hs.length ? `<div class="list">${hs.map(row).join("")}</div>` : `<div class="list"><div class="empty">No habits yet. Start tiny: two minutes a day counts. 🌱</div></div>`;
    h += confirmBox();
    h += `<div class="btns add"><button type="button" class="btn" data-act="openForm" data-form="habit">New habit</button></div>`;
    if (arch.length) h += archivedSection(arch.length, () => `<div class="list">${arch.map(row).join("")}</div>`);
    h += `<p class="hint" style="margin-top:14px">Rest days and unscheduled days never count against you. Missing a day only shows as an empty dot; your history stays. Open a habit to see its calendar and fix past days.</p>`;
    return h;
  }
  function calendar(h) {
    const t = today(), ym = ui.calMonth || t.slice(0, 7), first = ym + "-01", start = firstDay(h);
    const [y, m] = ym.split("-").map(Number);
    const title = new Date(y, m - 1, 1, 12).toLocaleDateString(undefined, { month: "long", year: "numeric" });
    let g = [1, 2, 3, 4, 5, 6, 0].map(i => `<span class="h" aria-hidden="true">${DAY_LETTERS[i]}</span>`).join("");
    for (let i = 0; i < (weekday(first) + 6) % 7; i++) g += "<span></span>";
    for (let k = first; k.slice(0, 7) === ym; k = addDays(k, 1)) {
      const l = logOf(h, k), fut = k > t;
      const cls = l === "done" ? "on" : l === "rest" ? "rest" : !scheduled(h, k) || isCount(h) || k < start || k === t ? "na" : fut ? "" : "off";
      const state = l === "done" ? "done" : l === "rest" ? "rest day" : fut ? "future" : "not done";
      g += `<button type="button" class="${cls} ${k === t ? "today" : ""}" data-act="cycleDay" data-id="${h.id}" data-day="${k}" ${fut ? "disabled" : ""} aria-label="${fmtDay(k)}, ${state}${fut ? "" : ". Tap to change."}">${parse(k).getDate()}</button>`;
    }
    const prev = dk(new Date(y, m - 2, 1, 12)).slice(0, 7), next = dk(new Date(y, m, 1, 12)).slice(0, 7);
    return `<div class="card" style="${cvars(itemColor(h))}"><div class="calhead"><button type="button" class="mini" data-act="calMonth" data-id="${prev}" aria-label="Previous month">‹ Prev</button><b>${title}</b><button type="button" class="mini" data-act="calMonth" data-id="${next}" ${next > t.slice(0, 7) ? "disabled style=\"visibility:hidden\"" : ""} aria-label="Next month">Next ›</button></div>
      <div class="cal">${g}</div><p class="hint">Tap a past day to cycle: done, rest, not done.</p></div>`;
  }
  function renderHabitDetail(x) {
    const st = habitStats(x), tot = habitTotals(x), wk = isCount(x), pp = wk && periodProgress(x, today());
    const unit = wk ? runUnit(x) : "days";
    const rate = wk ? `${tot.done30} time${tot.done30 === 1 ? "" : "s"} in the last 30 days (target about ${Math.round(x.times * 30 / x.every)})${isCalWeek(x) ? "" : `. This period runs ${fmtDay(pp.start)} to ${fmtDay(pp.end)}`}`
      : tot.counted30 ? `${tot.done30} of ${tot.counted30} scheduled days in the last 30 (${Math.round(tot.done30 / tot.counted30 * 100)}%)` : "No scheduled days yet in the last 30";
    let h = `<div class="btns" style="margin-top:4px"><button type="button" class="mini" data-act="closeHabit" style="padding-left:0">‹ All habits</button></div>
      <div class="card" style="${cvars(itemColor(x))};border-top:4px solid var(--c, var(--accent-bright))"><div><div class="title" style="font-weight:700;font-size:20px;font-family:var(--font-display)">${emojiOf(x)}${esc(x.name)}</div>
      <div class="sub" style="font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 10px"><span>${schedText(x)}</span>${goalChip(x.goalId, amtTag(x))}${x.archived ? '<span class="chip rest">Archived</span>' : ""}</div></div>
      <div class="summary four" style="margin:0">
        <div><b>${st.run}</b><span>${unit} in a row now</span></div>
        <div><b>${st.best}</b><span>best run (${unit})</span></div>
        <div><b>${tot.total}</b><span>times done</span></div>
        <div><b>${wk ? `${pp.done}/${pp.target}` : tot.counted30 ? Math.round(tot.done30 / tot.counted30 * 100) + "%" : "–"}</b><span>${wk ? (isCalWeek(x) ? "this week" : "this period") : "last 30 days"}</span></div>
      </div><p class="hint">${rate}.</p>
      <div class="btns"><button type="button" class="mini" data-act="editHabit" data-id="${x.id}">Edit</button><button type="button" class="mini muted" data-act="archiveHabit" data-id="${x.id}">${x.archived ? "Unarchive" : "Archive"}</button><button type="button" class="mini danger" data-act="askDeleteHabit" data-id="${x.id}">Delete</button></div></div>`;
    h += confirmBox();
    const str = habitStrength(x);
    h += `<h2>Strength</h2><div class="card" style="${cvars(itemColor(x))}"><div class="strength">${ring(str, 100, "var(--c)").replace(`${str}/100`, `${str}%`)}<p><b>${str >= 80 ? "Rock solid 💪" : str >= 50 ? "Getting stronger" : str >= 20 ? "Taking root 🌱" : "Just starting"}</b><br><span class="hint">Grows with every check-in and dips gently after a miss. One missed day never wipes it out.</span></p></div>${heatmap(x)}</div>`;
    h += `<h2>History</h2>` + calendar(x);
    if (x.archived) h += `<p class="hint" style="margin-top:12px">Archived habits are hidden from Today. Their history and goal progress stay.</p>`;
    return h;
  }

  function taskForm(t) {
    const e = !!t; t = t || { due: today(), priority: 2, amount: 1 };
    return `<h2>${e ? "Edit task" : "New task"}</h2><form class="card" data-form="task" data-id="${e ? t.id : ""}" data-autofocus>
      <label for="t-title">Task<input id="t-title" name="title" required maxlength="140" placeholder="Read 10 pages" value="${esc(t.title)}"></label>
      <div class="fields"><label for="t-due">Due<input id="t-due" name="due" type="date" value="${esc(t.due)}"></label>
      <label for="t-pr">Priority<select id="t-pr" name="priority">${[[2, "Normal"], [1, "High"], [3, "Low"]].map(([v, n]) => `<option value="${v}" ${Number(t.priority) === v ? "selected" : ""}>${n}</option>`).join("")}</select></label></div>
      <div class="fields"><label for="t-goal">Counts toward<select id="t-goal" name="goalId">${goalOptions(t.goalId || "")}</select></label>
      <label for="t-amt">Amount when done<input id="t-amt" name="amount" type="number" inputmode="decimal" step="any" min="0" value="${esc(t.goalId || !e ? t.amount || 1 : 1)}"></label></div>
      ${partSelect(t.part, "t-part")}
      ${formBtns(e ? "Save task" : "Create task", e ? `<button type="button" class="btn ghost" style="color:var(--warn)" data-act="askDeleteTask" data-id="${t.id}">Delete</button>` : "")}</form>`;
  }
  function renderTasks() {
    const open = S.tasks.filter(t => !t.dropped && !t.done).sort((a, b) => (a.due || "9999") < (b.due || "9999") ? -1 : (a.due || "9999") > (b.due || "9999") ? 1 : a.priority - b.priority);
    const done = S.tasks.filter(t => !t.dropped && t.done).slice(-10).reverse();
    let h = open.length ? `<div class="list">${open.map(t => taskRow(t, { manage: true, overdueActions: true })).join("")}</div>` : `<div class="list"><div class="empty">All clear. Nothing on your list. ✨</div></div>`;
    h += confirmBox();
    h += `<div class="btns add"><button type="button" class="btn" data-act="openForm" data-form="task">New task</button></div>`;
    if (done.length) h += `<h2>Recently done</h2><div class="list">${done.map(t => taskRow(t, { manage: true })).join("")}</div>`;
    return h;
  }

  function renderMore() {
    const json = JSON.stringify(S, null, 1);
    const t = today();
    let opened = 0; for (let i = 0; i < 7; i++) if (S.opens?.[addDays(t, -i)]) opened++;
    const fbList = FB.list.length ? `<div class="list">${FB.list.map(f => `<div class="row"><div class="main"><div class="title">${esc(f.text)}</div><div class="sub"><span class="chip ${f.kind === "bug" ? "warn" : ""}">${f.kind === "bug" ? "Bug" : "Idea"}</span><span>${esc(f.day || "")}</span>${f.status ? `<span class="chip">${esc(f.status)}</span>` : "<span>Waiting for Claude</span>"}</div></div></div>`).join("")}</div>` : `<div class="list"><div class="empty">Your reports live on GitHub: <a href="${ISSUES}" style="color:var(--accent)">see all reports</a>. Claude marks each one when it's fixed.</div></div>`;
    return `<h2>Your trial</h2><div class="card"><p class="hint" style="color:var(--ink)">You opened Ascend on <b>${opened} of the last 7 days</b>${S.trialStart ? ` (trial started ${fmtDay(S.trialStart)})` : ""}.</p><p class="hint">This counts days you opened the app, to check whether it fits your routine. It stays in your data and isn't sent anywhere else.</p></div>
    <h2>Your reports <small>${FB.list.length}</small></h2>${fbList}

    <h2>Your data</h2><div class="card">
      <p class="hint">Status: <b>${esc(syncEl.textContent)}</b>. Your data is stored only on this phone, in this Home Screen app. Export now and then and keep the copy in Notes, so you can restore it if anything goes wrong.</p>

      ${ui.exportShown ? `<textarea id="exp" readonly aria-label="Exported data">${esc(json)}</textarea><div class="btns"><button type="button" class="btn" data-act="copyExport">Copy</button><button type="button" class="btn ghost" data-act="saveExport">Save as file</button></div>` : ""}
      ${ui.msg ? `<p class="hint">${esc(ui.msg)}</p>` : ""}
    </div>

      <label for="imp">Paste an export<textarea id="imp" placeholder='{"v":1, ...}'>${esc(ui.importText)}</textarea></label>

    <h2>Start over</h2><div class="card"><p class="hint">Deletes all goals, habits, tasks and history. Export first if you want a copy.</p><div class="btns"><button type="button" class="btn ghost" data-act="askReset" style="color:var(--warn)">Delete everything</button></div></div>

    <h2>Add to Home Screen</h2><div class="card"><p class="hint">In Safari, tap Share, then "Add to Home Screen". From then on open Ascend from that icon: the icon and Safari keep separate data.</p></div>`;
  }

  function renderReport() {
    const box = document.getElementById("report");

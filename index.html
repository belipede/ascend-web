  // Create and edit forms, confirmations and quick add open in a bottom sheet.
  // The sheet is rebuilt only when what it shows changes, so typing survives other re-renders.
  let sheetKey = "";
  function addSheet() {
    return `<h2>Add</h2><form class="card" data-form="quick" data-autofocus>
      <label for="qa2">New task<input id="qa2" name="title" placeholder="Call Sam fri evening !high #books" maxlength="140" autocomplete="off" enterkeyhint="done" data-parse></label>
      <div class="parse" id="qa2-parse" aria-live="polite">${parseChips(parseQuick("", today()))}</div>
      <p class="hint">Write a date (tomorrow, fri, 3 dec, in 5 days), a time of day (morning, evening), ! for high priority, and # plus a goal's name to link it.</p>
      <div class="btns"><button class="btn" type="submit">Add task</button><button class="btn ghost" type="button" data-act="closeForm">Cancel</button></div>
      <div class="moreadd"><button type="button" class="mini" data-act="openForm" data-form="habit">＋ New habit</button><button type="button" class="mini" data-act="openForm" data-form="goal">＋ New goal</button><button type="button" class="mini muted" data-act="openForm" data-form="task">Task with all options</button></div>
    </form>`;
  }
  function sheetBody() {
    if (ui.confirm) return { key: "c:" + ui.confirm.text, label: "Confirm", html: confirmCard() };
    const f = ui.form; if (!f) return null;
    const [kind, id] = f.split(":");
    const g = id && goalById(id), h = id && S.habits.find(x => x.id === id), t = id && S.tasks.find(x => x.id === id);
    const html = kind === "add" ? addSheet() : kind === "goal" ? (id ? (g ? `<h2>Edit goal</h2>${goalForm(g)}` : "") : goalForm(null))
      : kind === "log" ? (g ? `<h2>Log progress</h2><p class="hint">${esc(g.name)} · ${ofTarget(g, goalProgress(g))}</p>${logForm(g)}` : "")
      : kind === "habit" ? (id ? (h ? `<h2>Edit habit</h2>${habitForm(h)}` : "") : habitForm(null))
      : kind === "task" ? (id ? (t ? taskForm(t) : "") : taskForm(null)) : "";
    return html ? { key: "f:" + f, label: { add: "Add", goal: "Goal", log: "Log progress", habit: "Habit", task: "Task" }[kind], html } : null;
  }
  function renderSheet() {
    const box = document.getElementById("sheet"), b = sheetBody();
    document.getElementById("fab").hidden = tab === "more" || !!b || (!hasData() && !S.started);
    if (!b) { if (sheetKey) { box.innerHTML = ""; sheetKey = ""; document.documentElement.classList.remove("sheet-open"); } return; }
    if (b.key === sheetKey) return;
    sheetKey = b.key;
    box.innerHTML = `<div class="sheet-wrap"><button type="button" class="sheet-bg" data-act="${ui.confirm ? "confirmNo" : "closeForm"}" aria-label="Close"></button><div class="sheet" role="dialog" aria-modal="true" aria-label="${b.label}"><div class="grab"></div>${b.html}</div></div>`;
    document.documentElement.classList.add("sheet-open");
    const first = box.querySelector(ui.confirm ? ".btn" : "form[data-autofocus] input:not([type=hidden])");
    if (first && (ui.confirm || !ui.form.includes(":"))) first.focus({ preventScroll: true });
  }
  document.addEventListener("keydown", e => { if (e.key === "Escape" && (ui.form || ui.confirm)) { if (ui.confirm) ui.confirm = null; else ui.form = null; render(); } });
  document.addEventListener("input", e => {
    if (!e.target.matches("[data-parse]")) return;
    const out = document.getElementById(e.target.id + "-parse");
    if (out) out.innerHTML = parseChips(parseQuick(e.target.value, today()));
  });

  const TITLES = { today: ["Today", "Ascend"], goals: ["The big picture", "Goals"], habits: ["Small steps", "Habits"], tasks: ["To do", "Tasks"], more: ["Settings", "More"] };
  function render() {
    if (!S) return;
    const [eb, hd] = TITLES[tab];
    document.getElementById("eyebrow").textContent = tab === "today" ? parse(today()).toLocaleDateString(undefined, { weekday: "long", day: "numeric", month: "long" }) : eb;
    document.getElementById("heading").textContent = tab === "today" && (hasData() || S.started) ? greeting() : hd;
    document.querySelectorAll("nav.tabs button").forEach(b => b.setAttribute("aria-current", b.dataset.tab === tab ? "page" : "false"));
    if (!hasData() && tab === "today" && !S.started) { view.innerHTML = renderWelcome(); renderSheet(); return; }
    view.innerHTML = { today: renderToday, goals: renderGoals, habits: renderHabits, tasks: renderTasks, more: renderMore }[tab]();
    ui.pop = null;
    renderSheet();
  }

  // ---------- Actions ----------
  function applyTemplate() {
    const t = today(), g = { id: uid(), name: "Read 24 books", emoji: "📚", color: "green", target: 24, unit: "books", deadline: `${parse(t).getFullYear()}-12-31`, createdDay: t };
    S.goals.push(g);
    S.habits.push({ id: uid(), name: "Read for 20 minutes", emoji: "📖", days: [], goalId: null, amount: 0, startDay: t });
    S.tasks.push({ id: uid(), title: "Finish current book", due: addDays(t, 6), priority: 2, goalId: g.id, amount: 1, done: false });
    S.tasks.push({ id: uid(), title: "Pick the next book", due: t, priority: 3, goalId: null, amount: 0, done: false });
    S.started = true;
    save();
  }
  // Only today and past days can be logged. Logging before a habit's start day moves its start back.
  function setLog(id, k, next) {
    const h = S.habits.find(x => x.id === id), t = today();
    if (!h || !k || !/^\d{4}-\d{2}-\d{2}$/.test(k) || k > t) return;
    const l = (S.logs[id] ||= {}), v = next(l[k]);
    if (v) l[k] = v; else delete l[k];
    if (v && h.startDay && k < h.startDay) h.startDay = k;
    save();
  }
  // ---------- Feedback: toast with Undo, small celebrations ----------
  let toastTimer = null;
  function toast(html, undo) {
    document.querySelector(".toast")?.remove(); clearTimeout(toastTimer);
    const el = document.createElement("div");
    el.className = "toast"; el.setAttribute("role", "status");
    el.innerHTML = `<span>${html}</span>${undo ? '<button type="button">Undo</button>' : ""}`;
    if (undo) el.querySelector("button").addEventListener("click", ev => { ev.stopPropagation(); undo(); el.remove(); render(); });
    document.body.appendChild(el);
    toastTimer = setTimeout(() => el.remove(), 4500);
  }
  function confetti() {
    if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    const box = document.createElement("div"); box.className = "confetti"; box.setAttribute("aria-hidden", "true");
    const cols = COLOR_KEYS.map(k => COLORS[k][0]);
    for (let i = 0; i < 36; i++) { const c = document.createElement("i"); c.style.left = Math.random() * 100 + "%"; c.style.background = cols[i % cols.length]; c.style.animationDelay = Math.random() * 0.4 + "s"; c.style.transform = `rotate(${Math.random() * 180}deg)`; box.appendChild(c); }
    document.body.appendChild(box); setTimeout(() => box.remove(), 2400);
  }
  const CHEERS = ["Nice one!", "Done. Keep it rolling.", "Another step up.", "That's the way.", "Small wins add up.", "Lovely. On to the next."];
  // After something is checked off: the biggest bit of good news wins.
  function celebrate(x, before, day, undo) {
    const g = x.goalId && goalById(x.goalId), after = dayCounts(day);
    if (g && Number(x.amount)) {
      const pct = pctOf(g), mark = [100, 75, 50, 25].find(m => before.pct < m && pct >= m);
      if (mark === 100) { confetti(); return toast(`🎉 <b>${esc(g.name)}</b>: target reached!`, undo); }
      if (after.total && after.done >= after.total && before.done < before.total) { confetti(); return toast(`All done for ${day === today() ? "today" : fmtDay(day)}. Brilliant! 🎉`, undo); }
      if (mark) return toast(`${mark === 50 ? "Halfway" : mark + "%"} to <b>${esc(g.name)}</b>! 🙌`, undo);
      return toast(`+${fmtAmt(Number(x.amount), g.unit)} · ${esc(g.name)} now ${ofTarget(g, goalProgress(g))}`, undo);
    }
    if (after.total && after.done >= after.total && before.done < before.total) { confetti(); return toast(`All done for ${day === today() ? "today" : fmtDay(day)}. Brilliant! 🎉`, undo); }
    toast(CHEERS[Math.floor(Math.random() * CHEERS.length)], undo);
  }
  const beforeOf = (x, day) => { const g = x.goalId && goalById(x.goalId); return { pct: g ? pctOf(g) : 0, ...dayCounts(day) }; };
  function pickIn(form, name, val, el) {
    form.querySelectorAll(`[data-act="${el.dataset.act}"]`).forEach(b => b.setAttribute("aria-checked", String(b === el)));
    const inp = form.querySelector(`input[name="${name}"]`); if (inp) inp.value = val;
  }

  const actions = {
    template() { applyTemplate(); },
    blank() { S.started = true; save(); tab = "goals"; ui.form = "goal"; },
    toggleHabit(id, el) {
      const h = S.habits.find(x => x.id === id), k = el.dataset.day; if (!h) return;
      const prev = logOf(h, k), start = h.startDay, before = beforeOf(h, k);
      setLog(id, k, v => v === "done" ? null : "done");
      const now = logOf(h, k); if (now === prev) return;
      const undo = () => { setLog(id, k, () => prev || null); h.startDay = start; save(); };
      if (now === "done") { ui.pop = `h:${id}:${k}`; celebrate(h, before, k, undo); }
      else toast(`Unticked ${esc(h.name)}`, undo);
    },
    restHabit(id, el) {
      const h = S.habits.find(x => x.id === id), k = el.dataset.day; if (!h) return;
      const prev = logOf(h, k), start = h.startDay;
      setLog(id, k, v => v === "rest" ? null : "rest");
      const undo = () => { setLog(id, k, () => prev || null); h.startDay = start; save(); };
      toast(logOf(h, k) === "rest" ? `Rest day for ${esc(h.name)}. Rest is part of the plan. 🌿` : `Rest day removed`, undo);
    },
    moveTomorrow(id) { const x = S.tasks.find(t => t.id === id); if (!x) return; const was = x.due; x.due = addDays(today(), 1); save(); toast(`Moved to tomorrow. Future you has it. 👍`, () => { x.due = was; save(); }); },
    groupBy(v) { uiPrefs.groupBy = v === "time" ? "time" : "goal"; saveUiPrefs(); },
    focusGoal(id) { ui.focus = ui.focus === id ? null : id; },
    toggleDone() { ui.showDone = !ui.showDone; },
    pickColor(id, el) { pickIn(el.closest("form"), "color", id, el); return Promise.resolve(); },
    pickEmoji(id, el) { pickIn(el.closest("form"), "emoji", id, el); return Promise.resolve(); },
    cycleDay(id, el) { setLog(id, el.dataset.day, v => v === "done" ? "rest" : v === "rest" ? null : "done"); },
    pickDay(_, el) { ui.day = el.dataset.day === today() ? null : el.dataset.day; },
    openHabit(id) { tab = "habits"; ui.detail = id; ui.form = null; ui.confirm = null; ui.calMonth = null; window.scrollTo(0, 0); },
    closeHabit() { ui.detail = null; ui.form = null; ui.confirm = null; },
    calMonth(ym) { ui.calMonth = ym; },
    editHabit(id) { const x = S.habits.find(h => h.id === id); if (!x) return; draftDays = (x.days || []).slice(); ui.form = "habit:" + id; ui.confirm = null; },
    editGoal(id) { ui.form = "goal:" + id; ui.confirm = null; },
    editTask(id) { ui.form = "task:" + id; ui.confirm = null; },
    archiveHabit(id) { const x = S.habits.find(h => h.id === id); if (x) { x.archived = !x.archived; save(); } },
    archiveGoal(id) { const g = goalById(id); if (g) { g.archived = !g.archived; if (ui.form === "goal:" + id) ui.form = null; save(); } },
    toggleArchived() { ui.showArchived = !ui.showArchived; },
    toggleTask(id) {
      const x = S.tasks.find(t => t.id === id); if (!x) return;
      const was = { done: x.done, doneOn: x.doneOn }, before = beforeOf(x, today());
      x.done = !x.done; x.doneOn = x.done ? today() : null; save();
      const undo = () => { Object.assign(x, was); save(); };
      if (x.done) { ui.pop = `t:${id}`; celebrate(x, before, today(), undo); } else toast(`Unticked ${esc(x.title)}`, undo);
    },
    moveToday(id) { const x = S.tasks.find(t => t.id === id); if (x) { x.due = today(); save(); } },
    moveAllToday() { const t = today(); S.tasks.forEach(x => { if (!x.dropped && !x.done && x.due && x.due < t) x.due = t; }); save(); },
    askDropOverdue() { ui.confirm = { text: "Let go of all carried-over tasks? They'll leave your lists. Sometimes letting go is the right call.", yes: "Let them go", run: () => { const t = today(); S.tasks.forEach(x => { if (!x.done && x.due && x.due < t) x.dropped = true; }); save(); } }; },
    askDeleteTask(id) { const x = S.tasks.find(t => t.id === id); ui.confirm = { text: `Delete "${x?.title}"?${x?.goalId && x?.done ? " Its goal progress will go down." : ""}`, yes: "Delete", run: () => { S.tasks = S.tasks.filter(t => t.id !== id); ui.form = null; save(); } }; },
    askDeleteHabit(id) { const x = S.habits.find(h => h.id === id); ui.confirm = { text: `Delete "${x?.name}" and its check-in history?${x?.goalId ? " Progress it added to its goal will be removed." : ""} To keep the history, archive it instead.`, yes: "Delete habit", run: () => { S.habits = S.habits.filter(h => h.id !== id); delete S.logs[id]; ui.detail = null; ui.form = null; save(); } }; },
    askDeleteGoal(id) { const g = goalById(id); ui.confirm = { text: `Delete goal "${g?.name}"? Linked habits and tasks stay; they just stop counting toward it. To keep it, archive it instead.`, yes: "Delete goal", run: () => { ui.form = null; S.goals = S.goals.filter(x => x.id !== id); S.entries = S.entries.filter(e => e.goalId !== id); S.habits.forEach(h => { if (h.goalId === id) h.goalId = null; }); S.tasks.forEach(t => { if (t.goalId === id) t.goalId = null; }); save(); } }; },
    logGoal(id) { ui.form = "log:" + id; },
    openForm(_, el) { ui.form = el.dataset.form; draftDays = []; },
    closeForm() { ui.form = null; },
    toggleDay(_, el) { const d = Number(el.dataset.day); draftDays = draftDays.includes(d) ? draftDays.filter(x => x !== d) : [...draftDays, d]; el.setAttribute("aria-pressed", String(draftDays.includes(d))); return Promise.resolve(); },
    confirmYes() { const c = ui.confirm; ui.confirm = null; c?.run(); },
    confirmNo() { ui.confirm = null; },
    showExport() { ui.exportShown = !ui.exportShown; ui.msg = ""; },
    async copyExport() { const ta = document.getElementById("exp"); try { await navigator.clipboard.writeText(ta.value); ui.msg = "Copied. Paste it somewhere safe, like Notes."; } catch (e) { ta.select(); ui.msg = "Select all the text above and copy it."; } render(); },
    async saveExport() {
      try { const blob = new Blob([JSON.stringify(S, null, 1)], { type: "application/json" }); const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = `ascend-export-${today()}.json`; document.body.appendChild(a); a.click(); document.body.removeChild(a); ui.msg = "Saved to your Downloads (Files app)."; }
      catch (e) { ui.msg = "Couldn't save a file. Use Copy instead."; }
      render();
    },
    askImport() {
      ui.importText = document.getElementById("imp")?.value || ui.importText;
      let data;
      try { data = validate(JSON.parse(ui.importText)); } catch (e) { ui.importErr = e instanceof SyntaxError ? "That text isn't valid JSON. Paste the whole export." : e.message; return; }
      ui.importErr = "";
      ui.confirm = { text: `Replace everything with this export (${data.goals.length} goals, ${data.habits.length} habits, ${data.tasks.length} tasks)?`, yes: "Replace my data", run: () => { S = data; S.started = true; ui.importText = ""; ui.msg = "Restored."; save(); } };
    },
    openReport() { FB.open = true; FB.sent = ""; FB.err = ""; renderReport(); window.scrollTo(0, 0); document.getElementById("fb-text")?.focus(); return Promise.resolve(); },
    closeReport() { FB.open = false; renderReport(); return Promise.resolve(); },
    fbKind(k) { FB.text = document.getElementById("fb-text")?.value || FB.text; FB.kind = k; renderReport(); return Promise.resolve(); },
    askReset() { ui.confirm = { text: "Delete all goals, habits, tasks and history?", yes: "Delete everything", run: () => { S = EMPTY(); save(); tab = "today"; } }; },
  };

  document.addEventListener("click", async e => {
    const tb = e.target.closest("nav.tabs button");
    if (tb) { tab = tb.dataset.tab; ui.form = null; ui.confirm = null; ui.detail = null; ui.day = null; render(); window.scrollTo(0, 0); return; }
    const el = e.target.closest("[data-act]");
    if (!el || !actions[el.dataset.act]) return;
    e.preventDefault();
    const r = actions[el.dataset.act](el.dataset.id, el);
    if (r && r.then) return;
    render();
    if (ui.scroll) { ui.scroll = false; const f = view.querySelector("form[data-autofocus]"); f?.scrollIntoView({ block: "center" }); f?.querySelector("input")?.focus({ preventScroll: true }); }
  });
  // Swipe a row left to show its two actions. A tap anywhere else closes it.
  let sw = null, swOpen = null, swiped = false;
  const ACTS_W = 152;
  const setX = (row, x, snap) => { row.classList.toggle("snap", !!snap); row.style.transform = x ? `translateX(${x}px)` : ""; };
  document.addEventListener("pointerdown", e => {
    const wrap = e.target.closest("[data-swipe]");
    if (swOpen && (!wrap || wrap !== swOpen) && !e.target.closest(".acts")) { setX(swOpen.querySelector(".row"), 0, true); swOpen = null; }
    if (!wrap || e.target.closest(".acts") || e.pointerType === "mouse" && e.button !== 0) return;
    sw = { wrap, row: wrap.querySelector(".row"), x0: e.clientX, y0: e.clientY, base: swOpen === wrap ? -ACTS_W : 0, on: false };
  });
  document.addEventListener("pointermove", e => {
    if (!sw) return;
    const dx = e.clientX - sw.x0, dy = e.clientY - sw.y0;
    if (!sw.on) { if (Math.abs(dy) > 10) { sw = null; return; } if (Math.abs(dx) < 10) return; sw.on = true; clearTimeout(holdTimer); }
    setX(sw.row, Math.max(-ACTS_W - 24, Math.min(0, sw.base + dx)));
  });
  const swEnd = () => {
    if (!sw) return;
    if (sw.on) {
      swiped = true; setTimeout(() => { swiped = false; }, 50);
      const x = parseFloat((sw.row.style.transform.match(/-?[\d.]+/) || [0])[0]);
      const open = x < -ACTS_W / 2;
      setX(sw.row, open ? -ACTS_W : 0, true); swOpen = open ? sw.wrap : null;
    }
    sw = null;
  };
  document.addEventListener("pointerup", swEnd); document.addEventListener("pointercancel", swEnd);
  document.addEventListener("click", e => { if (swiped) { swiped = false; e.stopImmediatePropagation(); e.preventDefault(); } }, true);
  // Press and hold a habit's circle for a rest day. The click that follows the hold is ignored.
  let holdTimer = null, held = false;
  document.addEventListener("pointerdown", e => {
    const el = e.target.closest("[data-hold]"); if (!el) return;
    held = false; clearTimeout(holdTimer);
    holdTimer = setTimeout(() => { held = true; actions[el.dataset.hold](el.dataset.id, el); render(); }, 550);
  });
  ["pointerup", "pointercancel", "pointerleave", "scroll"].forEach(t => document.addEventListener(t, () => clearTimeout(holdTimer), true));
  document.addEventListener("contextmenu", e => { if (e.target.closest("[data-hold]")) e.preventDefault(); });
  document.addEventListener("click", e => { if (held && e.target.closest("[data-hold]")) { held = false; e.stopImmediatePropagation(); e.preventDefault(); } }, true);
  document.addEventListener("submit", e => {
    e.preventDefault();
    const f = e.target, fd = new FormData(f), kind = f.dataset.form;
    const num = (v, d) => { const n = Number(v); return Number.isFinite(n) && n >= 0 ? n : d; };
    if (kind === "report") {
      const text = String(fd.get("text") || "").trim(); if (!text) return;
      if (!FB.col) {
        const title = (FB.kind === "bug" ? "Bug: " : "Idea: ") + text.slice(0, 60);
        const body = text + "\n\n---\nScreen: " + tab + " · Day: " + today() + " · Version: " + VERSION + " · " + navigator.userAgent;
        const url = ISSUES + "/new?labels=" + (FB.kind === "bug" ? "bug" : "idea") + "&title=" + encodeURIComponent(title) + "&body=" + encodeURIComponent(body);
        FB.open = false; FB.text = ""; FB.sent = "Opening GitHub. Tap Submit new issue there to send it.";
        renderReport(); location.href = url; return;
      }
      FB.col.add({ kind: FB.kind, text, tab, day: today(), version: VERSION, createdAt: Date.now(), status: "" })
        .then(() => { FB.open = false; FB.text = ""; FB.sent = "Report sent. Thanks, Claude will see it next time you ask for fixes."; renderReport(); })
        .catch(() => { FB.err = "Couldn't send just now. Try again in a moment."; FB.text = text; renderReport(); });
      return;
    }
    if (kind === "quick") {
      const raw = String(fd.get("title") || "").trim(); if (!raw) return;
      const q = parseQuick(raw, today());
      const x = { id: uid(), title: q.title, due: q.due, priority: q.priority, goalId: q.goalId, amount: q.goalId ? (q.amount ?? 1) : 0, part: q.part, done: false };
      S.tasks.push(x); S.started = true; save();
      const fromSheet = ui.form === "add"; ui.form = null; render();
      const when = !x.due ? "with no date" : x.due === today() ? "for today" : x.due === addDays(today(), 1) ? "for tomorrow" : "for " + fmtDay(x.due);
      toast(`Added ${when} ✨`, () => { S.tasks = S.tasks.filter(y => y.id !== x.id); save(); });
      if (!fromSheet) document.getElementById("qa")?.focus();
      return;
    }
    // Edit forms carry the item's id; new-item forms leave it empty.
    const editId = f.dataset.id;
    const partOf = () => PARTS[fd.get("part")] ? String(fd.get("part")) : null;
    const look = () => ({ color: COLORS[fd.get("color")] ? String(fd.get("color")) : null, emoji: firstGrapheme(fd.get("emoji")) || null });
    const upsert = (list, fields, make) => { const x = editId && list.find(i => i.id === editId); if (x) Object.assign(x, fields); else if (!editId) list.push({ ...make(), ...fields }); };
    if (kind === "goal") { const target = num(fd.get("target"), 0); const name = String(fd.get("name")).trim(); if (!(target > 0) || !name) return; upsert(S.goals, { ...look(), name, target, unit: String(fd.get("unit") || "").trim(), deadline: fd.get("deadline") || null }, () => ({ id: uid(), createdDay: today() })); }
    if (kind === "habit") { const gid = fd.get("goalId") || null, name = String(fd.get("name")).trim(); if (!name) return; const every = Math.max(2, Math.min(365, Math.round(Number(fd.get("every")) || 7))), times = Math.max(0, Math.min(every, Math.round(Number(fd.get("times")) || 0)));
      // Keep a count habit's period timing unless its length changes; otherwise periods start today.
      const old = editId && S.habits.find(i => i.id === editId), anchor = times ? (old && isCount(old) && Number(old.every) === every ? old.anchor : today()) : null;
      upsert(S.habits, { ...look(), part: partOf(), name, days: times ? [] : draftDays.slice(), times, every: times ? every : null, anchor, goalId: gid, amount: gid ? num(fd.get("amount"), 1) : 0 }, () => ({ id: uid(), startDay: today() })); }
    if (kind === "task") { const gid = fd.get("goalId") || null, title = String(fd.get("title")).trim(); if (!title) return; upsert(S.tasks, { part: partOf(), title, due: fd.get("due") || null, priority: Number(fd.get("priority")) || 2, goalId: gid, amount: gid ? num(fd.get("amount"), 1) : 0 }, () => ({ id: uid(), done: false })); }
    if (kind === "log") { const amount = Number(fd.get("amount")); if (!Number.isFinite(amount) || amount === 0) return; S.entries.push({ id: uid(), goalId: f.dataset.id, day: today(), amount, note: String(fd.get("note") || "").trim() }); }
    S.started = true; ui.form = null; save(); render();
  });
  document.addEventListener("input", e => { if (e.target.id === "imp") ui.importText = e.target.value; if (e.target.id === "fb-text") FB.text = e.target.value; });
  document.addEventListener("change", e => {
    if (e.target.id !== "impf" || !e.target.files?.[0]) return;
    const r = new FileReader();
    r.onload = () => { ui.importText = String(r.result || ""); ui.importErr = ""; render(); };
    r.readAsText(e.target.files[0]);
  });
  // Re-render when the app comes back so "today" rolls over at local midnight.
  document.addEventListener("visibilitychange", () => { if (!document.hidden) render(); });
  setInterval(() => { if (!document.hidden && !ui.form && !ui.confirm && !document.activeElement?.matches("input,textarea,select")) render(); }, 60000);

  function markOpen() {
    const t = today();
    S.opens ||= {};
    if (hasData() && !S.trialStart) S.trialStart = t;
    if (hasData() && !S.opens[t]) { S.opens[t] = true; save(); }
  }
  S = readLocal() || EMPTY();
  setSync(window.claude?.use ? "Connecting…" : "Saved on this device");
  render();
  connect().then(() => { markOpen(); render(); });
  document.addEventListener("visibilitychange", () => { if (!document.hidden) markOpen(); });
})();
</script>

</body>
